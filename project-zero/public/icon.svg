<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PROJECT ZERO">
  <!-- Source of truth for the app icons. The zero sits on a baseline: the
       fixed reference every measurement in PROJECT ZERO is compared against.
       Content stays inside the 80% safe circle so maskable icons survive. -->
