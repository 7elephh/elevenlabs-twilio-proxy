<title>Le King Barber</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --noir:#111214;--noir-soft:#18191c;--ivoire:#F2EDE4;--champagne:#B8AD99;--champagne-dark:#8f846f;--graphite:#52504C;
  --line:rgba(242,237,228,.1);--muted:rgba(242,237,228,.6);--faint:rgba(242,237,228,.4);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--noir);color:var(--ivoire);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance}
:focus-visible{outline:1px solid var(--champagne);outline-offset:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.wrap{padding:0 40px}}
.label{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne)}
.sec-label{display:flex;align-items:center;gap:16px}
.sec-label .n{color:var(--faint)} .sec-label .r{height:1px;width:48px;background:rgba(184,173,153,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 28px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;transition:all .5s var(--ease)}
.btn-solid{background:var(--ivoire);color:var(--noir)} .btn-solid:hover{background:var(--champagne)}
.btn-outline{border:1px solid rgba(242,237,228,.3)} .btn-outline:hover{border-color:var(--champagne);color:var(--champagne)}
.btn-ghost{padding:8px 0;color:rgba(242,237,228,.8)} .btn-ghost:hover{color:var(--champagne)}
.btn-dark{background:var(--noir);color:var(--ivoire)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.arrow{width:24px;height:8px}
.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;gap:8px;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(17,18,20,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.demo-bar b{color:var(--champagne);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:10px}
.demo-bar a{border:1px solid var(--line);padding:6px 10px;letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--ivoire)}
.demo-bar a.on{background:var(--ivoire);color:var(--noir)}
/* Header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top);transition:all .7s var(--ease);border-bottom:1px solid transparent}
.hdr.solid{background:rgba(17,18,20,.86);backdrop-filter:blur(10px);border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.hdr .mono{width:36px}
.nav{display:none;align-items:center;gap:40px}
.nav a{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,228,.75)}
.nav a:hover{color:var(--ivoire)}
.burger{display:flex;flex-direction:column;gap:7px;padding:12px;margin-right:-12px}
.burger span{display:block;width:24px;height:1px;background:var(--ivoire);transition:transform .5s}
.burger.open span:first-child{transform:translateY(4px) rotate(45deg)} .burger.open span:last-child{transform:translateY(-4px) rotate(-45deg)}
.mmenu{position:fixed;inset:0;z-index:45;background:var(--noir);padding:112px 24px 90px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity .5s}
.mmenu.open{opacity:1;pointer-events:auto}
.mmenu nav{display:flex;flex-direction:column;gap:24px}
.mmenu nav a{font-family:var(--serif);font-size:38px}
@media(min-width:768px){.hdr .wrap{height:80px}.hdr .mono{width:40px}.nav{display:flex}.burger{display:none}}
/* Hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:radial-gradient(ellipse at 70% 35%,#26262a 0%,#111214 62%)}
.hero .wm{position:absolute;right:-18%;top:8%;width:95%;max-width:900px;opacity:.06;pointer-events:none}
.hero .inner{position:relative;width:100%;padding-top:128px;padding-bottom:96px}
.hero h1{margin-top:24px;font-size:clamp(3.1rem,11vw,7.5rem);font-weight:300;line-height:.95;max-width:900px}
.hero p.sub{margin-top:28px;max-width:440px;color:rgba(242,237,228,.7);font-size:17px;line-height:1.7}
.hero .ctas{margin-top:40px;display:flex;flex-direction:column;gap:16px}
@media(min-width:640px){.hero .ctas{flex-direction:row;align-items:center}}
@media(min-width:768px){.hero .wm{right:-6%;top:6%;width:62%}}
.rise{animation:rise .9s var(--ease) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.rise{animation:none}html{scroll-behavior:auto}}
/* Sections */
section.s{padding:96px 0}
@media(min-width:768px){section.s{padding:144px 0}}
.grid12{display:grid;gap:40px}
@media(min-width:768px){.grid12{grid-template-columns:5fr 1fr 6fr}.grid12>.l{grid-column:1}.grid12>.r{grid-column:3}}
.h2{margin-top:32px;font-size:clamp(2.4rem,6vw,4rem);line-height:1.02}
.lead{font-size:19px;line-height:1.8;color:rgba(242,237,228,.75)}
.steps{display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:64px}
.steps>div{background:var(--noir-soft);padding:40px 0}
.steps .k{font-family:var(--serif);font-style:italic;color:var(--champagne)}
.steps h3{font-size:30px;margin-top:16px}
.steps p{margin-top:12px;max-width:300px;color:var(--muted)}
@media(min-width:768px){.steps{grid-template-columns:repeat(3,1fr)}.steps>div{padding:40px}.steps>div:first-child{padding-left:0}}
.ivory{background:var(--ivoire);color:var(--noir)}
.svc{display:flex;gap:24px;align-items:flex-start;padding:32px 0;border-bottom:1px solid rgba(17,18,20,.15)}
.svc h3{font-size:30px;line-height:1.15;transition:transform .7s var(--ease)}
.svc:hover h3{transform:translateX(4px)}
.svc p.d{margin-top:12px;color:var(--graphite);max-width:440px}
.svc .meta{margin-top:16px;display:inline-flex;gap:12px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(17,18,20,.6)}
.svc .price{font-family:var(--serif);font-size:32px;white-space:nowrap}
.hours td,.hours th{padding:16px 0;border-bottom:1px solid var(--line);font-weight:400;text-align:left}
.hours td{text-align:right;font-variant-numeric:tabular-nums}
.hours tr.today{color:var(--ivoire)} .hours tr{color:rgba(242,237,228,.65)}
.final{text-align:center;padding:112px 0 160px}
.final img{width:220px;margin:0 auto}
footer{border-top:1px solid var(--line);padding:56px 0 120px}
footer .row{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end}
footer nav{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,228,.55)}
/* Booking */
.bk{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding-top:112px;padding-bottom:220px}
@media(min-width:900px){.bk{grid-template-columns:minmax(0,8fr) 4fr;padding-top:144px;padding-bottom:120px}}
.stepper{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.stepper i{font-family:var(--serif);font-size:14px;letter-spacing:0;text-transform:none}
.stepper .ln{width:28px;height:1px;background:rgba(242,237,228,.2)}
.stepper .cur{color:var(--ivoire)} .stepper .done{color:var(--champagne)} .stepper .todo{color:rgba(242,237,228,.3)}
.stepper .t{display:none} @media(min-width:640px){.stepper .t{display:inline}}
.bk h1{margin-top:40px;font-size:clamp(2.4rem,7vw,3.75rem);line-height:1}
.opt{display:flex;width:100%;align-items:center;gap:20px;padding:28px 0;border-bottom:1px solid var(--line);text-align:left;transition:background .3s}
.opt:hover{background:rgba(242,237,228,.02)}
.opt .n{display:block;font-family:var(--serif);font-size:28px;line-height:1.15}
.opt .d{display:block;margin-top:8px;font-size:14px;color:rgba(242,237,228,.55);max-width:440px}
.opt .m{display:block;margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne)}
.opt .p{font-family:var(--serif);font-size:30px;white-space:nowrap}
.days{display:flex;gap:8px;overflow-x:auto;margin:20px -20px 0;padding:0 20px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
@media(min-width:768px){.days{display:grid;grid-template-columns:repeat(7,1fr);margin:20px 0 0;padding:0}}
.day{min-width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border:1px solid rgba(242,237,228,.15);transition:all .3s}
.day .w{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.day .n{font-family:var(--serif);font-size:24px;line-height:1}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--champagne)}
.day:hover{border-color:var(--champagne)}
.day.sel{background:var(--ivoire);color:var(--noir);border-color:var(--ivoire)} .day.sel .dot{background:var(--noir)}
.day[disabled]{border-color:rgba(242,237,228,.05);color:rgba(242,237,228,.25)} .day[disabled] .dot{background:transparent}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(min-width:640px){.slots{grid-template-columns:repeat(5,1fr)}}@media(min-width:900px){.slots{grid-template-columns:repeat(6,1fr)}}
.slot{padding:14px 0;border:1px solid rgba(242,237,228,.15);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:all .3s}
.slot:hover{border-color:var(--champagne)} .slot.sel{background:var(--ivoire);color:var(--noir);border-color:var(--ivoire)}
.navbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(242,237,228,.15)}
.navbtn[disabled]{opacity:.25}
.field{width:100%;border:1px solid rgba(242,237,228,.15);background:transparent;padding:14px 16px;font-size:16px;transition:border-color .3s;border-radius:0}
.field:focus{border-color:var(--champagne);outline:none}
.flabel{display:block;margin-bottom:8px;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,228,.7)}
.form{margin-top:40px;display:grid;gap:24px}
@media(min-width:640px){.form{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
.err{margin-top:8px;font-size:13px;color:var(--champagne)}
.notice{margin-top:32px;border-left:2px solid var(--champagne);background:rgba(242,237,228,.04);padding:16px 20px;font-size:14px}
.summary{position:fixed;left:0;right:0;bottom:44px;z-index:40;background:rgba(17,18,20,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:16px 20px}
.summary .top{display:flex;justify-content:space-between;gap:16px;align-items:center}
.summary .svcname{font-family:var(--serif);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .when{font-size:12px;color:var(--muted);margin-top:2px}
.summary .btn{width:100%;margin-top:14px}
.summary .lg{display:none}
@media(min-width:900px){.summary{position:sticky;top:128px;bottom:auto;border:1px solid var(--line);background:var(--noir-soft);padding:32px;align-self:start}.summary .lg{display:block}.summary .top{display:block}.summary .sm{display:none}}
.dl{border-top:1px solid var(--line);margin-top:48px}
.dl div{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}
.dl dt{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,228,.45)}
.dl dd{font-family:var(--serif);font-size:22px;text-align:right}
.fl::first-letter{text-transform:uppercase}
/* Admin */
.adm{display:block;min-height:100svh;padding-bottom:150px}
@media(min-width:900px){.adm{display:grid;grid-template-columns:240px 1fr;padding-bottom:50px}}
.side{display:none;position:sticky;top:0;height:100svh;border-right:1px solid var(--line);padding:20px;flex-direction:column;justify-content:space-between}
@media(min-width:900px){.side{display:flex}.atop{display:none!important}}
.side a.it{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:14px;color:rgba(242,237,228,.55)}
.side a.it.on{background:rgba(242,237,228,.07);color:var(--ivoire)}
.side a.it:hover{color:var(--ivoire)}
.ic{width:20px;height:20px;flex:none}
.atop{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top))}
.amain{min-width:0;padding:32px 20px}
@media(min-width:900px){.amain{padding:48px 40px}}
.tabs{position:fixed;left:0;right:0;bottom:44px;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(17,18,20,.96);border-top:1px solid var(--line)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:10px;color:rgba(242,237,228,.55)}
.tabs a.on{color:var(--champagne)}
@media(min-width:900px){.tabs{display:none}}
.ph{display:flex;flex-direction:column;gap:16px;margin-bottom:32px}
@media(min-width:768px){.ph{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.ph h1{font-size:44px;line-height:1.05}
.ph .sub{margin-top:6px;font-size:14px;color:rgba(242,237,228,.55)}
.card{border:1px solid var(--line);background:var(--noir-soft);padding:20px}
@media(min-width:768px){.card{padding:24px}}
.card h2{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne);margin-bottom:20px;display:flex;justify-content:space-between}
.card h2 a{color:rgba(242,237,228,.5);letter-spacing:0;text-transform:none;font-weight:400;font-size:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis div{background:var(--noir);padding:20px}
.kpis p:first-child{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,228,.45)}
.kpis p:last-child{margin-top:12px;font-family:var(--serif);font-size:36px}
.g2{display:grid;gap:24px;margin-top:24px}
@media(min-width:1000px){.g2{grid-template-columns:1fr 1fr}}
.bl a{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.bl a:last-child{border-bottom:0}
.bl .t{width:64px;text-align:center;flex:none}
.bl .t small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,237,228,.45)}
.bl .t b{font-family:var(--serif);font-weight:400;font-size:24px}
.bl .who{min-width:0;flex:1}
.bl .who p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .who p+p{font-size:12px;color:rgba(242,237,228,.5)}
.badge{display:inline-block;border:1px solid rgba(184,173,153,.5);color:var(--champagne);padding:2px 8px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.badge.x{border-color:rgba(242,237,228,.15);color:rgba(242,237,228,.4)}
.empty{padding:20px 0;font-size:14px;color:rgba(242,237,228,.45)}
.seg{display:flex;border:1px solid rgba(242,237,228,.15)}
.seg a,.seg button{padding:10px 16px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,237,228,.6)}
.seg .on{background:var(--ivoire);color:var(--noir)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.cal{border:1px solid var(--line);overflow-x:auto}
.cal .in{min-width:100%}
.cal.week .in{min-width:760px}
.cal .head,.cal .body{display:grid}
.cal .head>div{border-left:1px solid var(--line);padding:12px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,237,228,.7);border-bottom:1px solid var(--line)}
.cal .head>div b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:0;margin-left:4px}
.cal .head>div.today{color:var(--champagne)}
.cal .col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(135deg,rgba(242,237,228,.035) 0 2px,transparent 2px 9px)}
.cal .open{position:absolute;left:0;right:0;background:var(--noir)}
.cal .hl{position:absolute;left:0;right:0;border-top:1px solid rgba(242,237,228,.06)}
.cal .lab{position:absolute;right:8px;transform:translateY(-50%);font-size:10px;color:rgba(242,237,228,.35)}
.cal .ev{position:absolute;left:4px;right:4px;z-index:2;overflow:hidden;border-left:2px solid var(--champagne);background:#25231f;padding:4px 8px;font-size:12px;line-height:1.25;text-align:left}
.cal .ev:hover{background:#2f2c26}
.cal .ev span{color:var(--champagne)} .cal .ev small{display:block;color:rgba(242,237,228,.55)}
.cal .blk{position:absolute;left:0;right:0;z-index:1;background:repeating-linear-gradient(135deg,rgba(242,237,228,.07) 0 6px,transparent 6px 12px);font-size:11px;color:rgba(242,237,228,.5);padding:4px 8px}
.ainput{width:100%;border:1px solid rgba(242,237,228,.15);background:var(--noir);padding:10px 12px;font-size:15px;border-radius:0}
.ainput:focus{border-color:var(--champagne);outline:none}
.alabel{display:block;margin-bottom:6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,237,228,.6)}
.abtn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;background:var(--ivoire);color:var(--noir)}
.abtn:hover{background:var(--champagne)}
.abtn.o{background:transparent;color:var(--ivoire);border:1px solid rgba(242,237,228,.25)}
.abtn.r{background:transparent;color:#f5b5ad;border:1px solid rgba(248,113,113,.4)}
.dayrow{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
@media(min-width:640px){.dayrow{flex-direction:row;align-items:flex-start}}
.dayrow .dn{width:110px;padding-top:9px;font-size:14px}
.range{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.range input{border:1px solid rgba(242,237,228,.15);background:var(--noir);padding:8px;font-size:14px;color-scheme:dark}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:99;background:var(--ivoire);color:var(--noir);padding:12px 20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.hint{font-size:12px;color:rgba(242,237,228,.45)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<nav class="demo-bar" aria-label="Mode démonstration">
  <b>Démo</b>
  <a href="#/" data-k="site">Site client</a>
  <a href="#/admin" data-k="admin">Espace salon</a>
  <a href="#reset" id="reset">Réinitialiser</a>
</nav>
<script>
"use strict";
let route="/";
function go(r){route=r||"/";render(true)}
const MONO="data:image/png;base64,__MONO__";
const LOGO="data:image/png;base64,__LOGO__";
const ARROW='<svg class="arrow" viewBox="0 0 24 8" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 4h23M19 .5 23 4l-4 3.5"/></svg>';
const ARROWL='<svg class="arrow" style="transform:rotate(180deg)" viewBox="0 0 24 8" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 4h23M19 .5 23 4l-4 3.5"/></svg>';
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

/* ---------- Dates (heure locale de l'appareil) ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const isoDay=s=>((parse(s).getDay()+6)%7)+1;
const at=(s,hm)=>{const d=parse(s);const [h,m]=hm.split(":").map(Number);d.setHours(h,m,0,0);return d};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hLabel=t=>t.replace(":","h");
const longDate=s=>{const d=parse(s);return `${DAYS[isoDay(s)-1].toLowerCase()} ${d.getDate()} ${MONTHS[d.getMonth()]}`};
const price=c=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:c%100?2:0}).format(c/100);
const dur=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?" "+pad(m%60):""}`;
const hourShort=t=>{const [h,m]=t.split(":");return m==="00"?`${+h}h`:`${+h}h${m}`};

function seed(){
  const today=ymd(new Date());
  const hours=[];for(let d=2;d<=6;d++){hours.push({weekday:d,opens:"09:30",closes:"12:30"},{weekday:d,opens:"14:00",closes:"19:00"})}
  const services=[
    {id:"s1",name:"Coupe + barbe",description:"Coupe sur mesure et taille de barbe précise, finitions soignées.",price:2000,duration:45,active:true},
    {id:"s2",name:"Coupe",description:"Coupe aux ciseaux ou à la tondeuse, adaptée à ton style.",price:1500,duration:30,active:true},
    {id:"s3",name:"Taille de barbe",description:"Mise en forme, contours nets et soin.",price:1000,duration:20,active:true},
  ];
  const st={services,hours,blocks:[],bookings:[],settings:{slot:15,notice:60,advance:60},salon:{address:"",city:"",phone:"",instagram:"",barber:"",bio:""}};
  // Quelques rendez-vous d'exemple pour remplir l'agenda
  const ex=[["Yanis","B.","s1","10:00"],["Mehdi","K.","s2","11:00"],["Lucas","M.","s3","15:00"],["Adam","R.","s1","17:15"],["Sami","T.","s2","10:30"]];
  let d=today,placed=0,guard=0;
  while(placed<ex.length&&guard<20){d=addDays(d,1);guard++;if(!hours.some(h=>h.weekday===isoDay(d)))continue;
    const [f,l,s,t]=ex[placed];const sv=services.find(x=>x.id===s);const start=at(d,t);
    st.bookings.push({id:"b"+placed,first:f,last:l,phone:"06 00 00 00 0"+placed,email:"",service:sv.name,serviceId:s,price:sv.price,duration:sv.duration,start:start.toISOString(),end:new Date(+start+sv.duration*6e4).toISOString(),status:"confirmed",source:placed%2?"admin":"online",created:new Date().toISOString()});
    placed++; if(placed===2||placed===4) d=addDays(d,0);
  }
  return st;
}

/* ---------- Moteur de disponibilités (même logique que le site réel) ---------- */
function availability(serviceId,from,to,excludeId){
  const sv=S.services.find(s=>s.id===serviceId);if(!sv)return[];
  const now=Date.now(),earliest=now+S.settings.notice*6e4,durMs=sv.duration*6e4,step=S.settings.slot*6e4;
  const first=ymd(new Date()),last=addDays(first,S.settings.advance);
  const busy=S.bookings.filter(b=>b.status!=="cancelled"&&b.id!==excludeId).map(b=>[+new Date(b.start),+new Date(b.end)]);
  const blocks=S.blocks.map(b=>[+new Date(b.start),+new Date(b.end)]);
  const out=[];
  for(let d=from<first?first:from;d<=to&&d<=last;d=addDays(d,1)){
    const ranges=S.hours.filter(h=>h.weekday===isoDay(d)).sort((a,b)=>a.opens.localeCompare(b.opens));
    const slots=[];
    for(const r of ranges){const o=+at(d,r.opens),c=+at(d,r.closes);
      for(let t=o;t+durMs<=c;t+=step){const e=t+durMs;if(t<earliest)continue;
        if(busy.some(([a,b])=>t<b&&a<e))continue;if(blocks.some(([a,b])=>t<b&&a<e))continue;
        slots.push({start:new Date(t).toISOString(),label:hm(new Date(t))})}}
    out.push({date:d,open:ranges.length>0,slots});
  }
  return out;
}
const slotFree=(sid,iso,ex)=>{const d=ymd(new Date(iso));return (availability(sid,d,d,ex)[0]?.slots||[]).some(s=>s.start===iso)};

const B={step:"service",service:null,win:null,date:null,slot:null,notice:null};
function reserve(pre){
  if(pre&&!B.service){B.service=pre;B.step="slot"}
  B.win??=ymd(new Date());
  const sv=S.services.find(s=>s.id===B.service);
  const idx=["service","slot","details"].indexOf(B.step);
  const steps=[["service","Prestation"],["slot","Créneau"],["details","Coordonnées"]].map(([k,t],i)=>`<button data-step="${k}" ${i>idx?"disabled":""} class="${i===idx?"cur":i<idx?"done":"todo"}"><i>0${i+1}</i> <span class="t">${t}</span></button>${i<2?'<span class="ln"></span>':""}`).join("");
  let body="";
  if(B.step==="service"){
    body=`<h1>Choisis ta prestation</h1><div style="margin-top:40px;border-top:1px solid var(--line)" role="radiogroup" aria-label="Prestations">${S.services.filter(s=>s.active).map(s=>`<button class="opt" role="radio" aria-checked="${B.service===s.id}" data-svc="${s.id}"><span style="flex:1"><span class="n">${esc(s.name)}</span><span class="d">${esc(s.description)}</span><span class="m">${dur(s.duration)}</span></span><span class="p">${price(s.price)}</span></button>`).join("")}</div>`;
  } else if(B.step==="slot"){
    const today=ymd(new Date()),last=addDays(today,S.settings.advance);
    const days=availability(B.service,B.win,addDays(B.win,13));
    if(!B.date||!days.some(d=>d.date===B.date&&d.slots.length)){B.date=days.find(d=>d.slots.length)?.date??null}
    const day=days.find(d=>d.date===B.date);
    const groups=day?[["Matin",s=>s.label<"12:00"],["Après-midi",s=>s.label>="12:00"&&s.label<"17:00"],["Fin de journée",s=>s.label>="17:00"]].map(([l,f])=>[l,day.slots.filter(f)]).filter(g=>g[1].length):[];
    const m=parse(B.win);
    body=`<h1>Choisis ton créneau</h1>
    <div style="margin-top:40px;display:flex;justify-content:space-between;align-items:center"><p class="label">${MONTHS[m.getMonth()]} ${m.getFullYear()}</p>
    <div style="display:flex;gap:8px"><button class="navbtn" id="prev" aria-label="Dates précédentes" ${B.win<=today?"disabled":""}>${ARROWL}</button><button class="navbtn" id="next" aria-label="Dates suivantes" ${addDays(B.win,14)>last?"disabled":""}>${ARROW}</button></div></div>
    <div class="days" role="listbox" aria-label="Jours">${days.map(d=>`<button class="day ${d.date===B.date?"sel":""}" role="option" aria-selected="${d.date===B.date}" data-date="${d.date}" ${d.slots.length?"":"disabled"}><span class="w">${DAYS_S[isoDay(d.date)-1]}</span><span class="n">${parse(d.date).getDate()}</span><span class="dot"></span></button>`).join("")}</div>
    <div style="margin-top:40px;min-height:180px" aria-live="polite">${day?`<p class="fl" style="font-family:var(--serif);font-size:24px">${longDate(day.date)}</p>${groups.map(([l,sl])=>`<p class="label" style="margin-top:28px;color:rgba(242,237,228,.5)">${l}</p><div class="slots">${sl.map(s=>`<button class="slot ${B.slot===s.start?"sel":""}" aria-pressed="${B.slot===s.start}" data-slot="${s.start}">${hLabel(s.label)}</button>`).join("")}</div>`).join("")}`:'<p style="color:var(--muted)">Aucun créneau disponible sur ces dates.</p>'}</div>`;
  } else {
    body=`<h1>Tes coordonnées</h1><form class="form" id="bform" novalidate>
      <div><label class="flabel" for="f1">Prénom</label><input class="field" id="f1" name="first" autocomplete="given-name" required></div>
      <div><label class="flabel" for="f2">Nom</label><input class="field" id="f2" name="last" autocomplete="family-name" required></div>

      <p class="err full" id="ferr" role="alert"></p></form>`;

  const when=B.slot?`<span class="fl" style="display:inline-block">${longDate(ymd(new Date(B.slot)))} · ${hLabel(hm(new Date(B.slot)))}</span>`:"—";

  return header()+`<main class="wrap bk"><div style="min-width:0"><nav class="stepper" aria-label="Étapes">${steps}</nav>${B.notice?`<p class="notice" role="alert">${esc(B.notice)}</p>`:""}${body}</div>

   ${action}</aside></main>`;
}
function bindReserve(){
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{B.step=b.dataset.step;B.notice=null;render()});
  document.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{B.service=b.dataset.svc;B.step="slot";B.slot=null;B.date=null;B.win=ymd(new Date());B.notice=null;render(true)});
  document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{B.date=b.dataset.date;B.slot=null;render()});
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{B.slot=b.dataset.slot;render()});
  $("#prev")&&($("#prev").onclick=()=>{const t=ymd(new Date());B.win=addDays(B.win,-14)<t?t:addDays(B.win,-14);B.date=null;B.slot=null;render()});
  $("#next")&&($("#next").onclick=()=>{B.win=addDays(B.win,14);B.date=null;B.slot=null;render()});

function agenda(view,date){
  const today=ymd(new Date());date=date||today;view=view||(innerWidth<900?"jour":"semaine");
  let days;if(view==="jour")days=[date];else{const m=addDays(date,-(isoDay(date)-1));days=Array.from({length:7},(_,i)=>addDays(m,i))}
  const step=view==="jour"?1:7,prev=addDays(date,-step),next=addDays(date,step);
  const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
  const rel=S.hours.filter(h=>days.some(d=>isoDay(d)===h.weekday));
  let a=rel.length?Math.min(...rel.map(h=>toMin(h.opens))):540,z=rel.length?Math.max(...rel.map(h=>toMin(h.closes))):1140;
  a=Math.floor(a/60)*60;z=Math.ceil(z/60)*60;const H=64,top=m=>(m-a)/60*H,height=(z-a)/60*H;
  const hrs=Array.from({length:(z-a)/60},(_,i)=>a/60+i);
  const mOf=d=>d.getHours()*60+d.getMinutes();
  const m=parse(date);
  const title=view==="jour"?`<span class="fl" style="display:inline-block">${longDate(date)} ${m.getFullYear()}</span>`:`Semaine du ${parse(days[0]).getDate()} ${MONTHS[parse(days[0]).getMonth()]}`;
  const cols=days.map(d=>{const open=S.hours.filter(h=>h.weekday===isoDay(d));
    const ev=S.bookings.filter(b=>b.status!=="cancelled"&&ymd(new Date(b.start))===d).map(b=>{const s=new Date(b.start),e=new Date(b.end);return `<a class="ev" href="#/admin/rdv/${b.id}" style="top:${top(mOf(s))+1}px;height:${Math.max(18,top(mOf(e))-top(mOf(s))-2)}px"><span>${hm(s)}</span> ${esc(b.first)} ${esc(b.last)}<small>${esc(b.service)}</small></a>`}).join("");
    const ds=+at(d,"00:00"),de=+at(addDays(d,1),"00:00");
    const bl=S.blocks.filter(b=>+new Date(b.start)<de&&+new Date(b.end)>ds).map(b=>{const s=Math.max(+new Date(b.start),ds),e=Math.min(+new Date(b.end),de);const t1=s===ds?0:mOf(new Date(s)),t2=e===de?1440:mOf(new Date(e));return `<div class="blk" style="top:${Math.max(0,top(t1))}px;height:${Math.max(18,top(Math.min(t2,z))-Math.max(0,top(t1)))}px">${b.kind==="vacation"?"Congés":"Bloqué"}${b.reason?" · "+esc(b.reason):""}</div>`}).join("");
    return `<div class="col" style="height:${height}px">${open.map(h=>`<div class="open" style="top:${top(toMin(h.opens))}px;height:${top(toMin(h.closes))-top(toMin(h.opens))}px"></div>`).join("")}${hrs.map(h=>`<div class="hl" style="top:${top(h*60)}px"></div>`).join("")}${bl}${ev}</div>`}).join("");
  const tpl=`56px repeat(${days.length},1fr)`;
  return adminShell("agenda",`<div class="ph"><div><h1>Agenda</h1><p class="sub">${title}</p></div><div class="tools">
   <div class="seg"><a class="${view==="jour"?"on":""}" href="#/admin/agenda/jour/${date}">Jour</a><a class="${view==="semaine"?"on":""}" href="#/admin/agenda/semaine/${date}">Semaine</a></div>
   <div class="seg"><a href="#/admin/agenda/${view}/${prev}" aria-label="Précédent">←</a><a href="#/admin/agenda/${view}/${today}">Aujourd'hui</a><a href="#/admin/agenda/${view}/${next}" aria-label="Suivant">→</a></div>
   <a class="abtn" href="#/admin/nouveau/${date}">+ Rendez-vous</a></div></div>
  <div class="cal ${view==="semaine"?"week":""}"><div class="in"><div class="head" style="grid-template-columns:${tpl}"><div style="border-left:0"></div>${days.map(d=>`<div class="${d===today?"today":""}"><a href="#/admin/agenda/jour/${d}">${DAYS_S[isoDay(d)-1]}.<b>${parse(d).getDate()}</b></a></div>`).join("")}</div>
  <div class="body" style="grid-template-columns:${tpl}"><div style="position:relative;height:${height}px">${hrs.map(h=>`<span class="lab" style="top:${top(h*60)}px">${h}h</span>`).join("")}</div>${cols}</div></div></div>
  <p class="hint" style="margin-top:12px">Zones hachurées : salon fermé ou pause. Touchez un rendez-vous pour le gérer.</p>`);
}

function bindHours(){

    row.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{const cur=read();cur.splice(+x.dataset.del,1);S.hours=S.hours.filter(h=>h.weekday!==wd).concat(cur);render()});

      for(let i=0;i<cur.length;i++){if(!cur[i].opens||!cur[i].closes||cur[i].closes<=cur[i].opens||(i&&cur[i].opens<cur[i-1].closes)){toast("Horaires invalides ou qui se chevauchent");return}}
      S.hours=S.hours.filter(h=>h.weekday!==wd).concat(cur);save();toast(cur.length?"Horaires enregistrés":"Jour marqué fermé");render()}});
  $("#badd").onclick=()=>{const d1=$("#b1").value,d2=$("#b2").value||d1;if(!d1){$("#berr").textContent="Indiquez au moins une date.";return}
    const s=at(d1,$("#b1t").value||"00:00"),e=$("#b2t").value?at(d2,$("#b2t").value):at(addDays(d2,1),"00:00");
    if(e<=s){$("#berr").textContent="La fin doit être après le début.";return}
    S.blocks.push({id:"k"+Date.now().toString(36),kind:$("#bk").value,start:s.toISOString(),end:e.toISOString(),reason:$("#br").value.trim()});save();
    const n=live().filter(b=>+new Date(b.start)<+e&&+new Date(b.end)>+s).length;toast(n?`Ajouté — attention : ${n} rendez-vous déjà réservé(s) sur cette période`:"Période ajoutée — créneaux retirés du site");render()};
  document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{S.blocks=S.blocks.filter(b=>b.id!==x.dataset.rm);save();render()});
}
function servicesPage(){
  return adminShell("svc",`<div class="ph"><div><h1>Prestations</h1><p class="sub">Nom, prix, durée et disponibilité en ligne.</p></div></div><div style="display:grid;gap:24px;max-width:860px">
  ${S.services.map(s=>`<section class="card" data-sid="${s.id}"><h2>${s.active?"En ligne":"Masquée"}</h2><div style="display:grid;gap:16px;grid-template-columns:2fr 1fr 1fr">
   <label><span class="alabel">Nom</span><input class="ainput" data-f="name" value="${esc(s.name)}"></label><label><span class="alabel">Prix (€)</span><input class="ainput" data-f="price" inputmode="decimal" value="${String(s.price/100).replace(".",",")}"></label><label><span class="alabel">Durée (min)</span><input class="ainput" data-f="duration" type="number" min="5" step="5" value="${s.duration}"></label>
   <label style="grid-column:1/-1"><span class="alabel">Description</span><input class="ainput" data-f="description" value="${esc(s.description)}"></label></div>
   <label style="display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px"><input type="checkbox" data-f="active" ${s.active?"checked":""} style="accent-color:#B8AD99"> Proposée à la réservation en ligne</label>
   <button class="abtn" data-ssave style="margin-top:16px">Enregistrer</button></section>`).join("")}</div>`);
}
function bindServices(){document.querySelectorAll("[data-sid]").forEach(c=>c.querySelector("[data-ssave]").onclick=()=>{const s=S.services.find(x=>x.id===c.dataset.sid);const g=k=>c.querySelector(`[data-f="${k}"]`);
  const p=Math.round(parseFloat(g("price").value.replace(",","."))*100),d=parseInt(g("duration").value,10);if(!g("name").value.trim()||!(p>=0)||!(d>=5)){toast("Valeurs invalides");return}
  Object.assign(s,{name:g("name").value.trim(),price:p,duration:d,description:g("description").value.trim(),active:g("active").checked});save();toast("Prestation mise à jour — visible sur le site");render()})}

function infoPage(){const c=S.salon;const f=(id,l,v,ph,full)=>`<label ${full?'style="grid-column:1/-1"':""}><span class="alabel">${l}</span><input class="ainput" id="${id}" value="${esc(v)}" placeholder="${ph}"></label>`;
  return adminShell("info",`<div class="ph"><div><h1>Infos du salon</h1><p class="sub">Affichées sur le site dès l'enregistrement.</p></div></div>
  <section class="card" style="max-width:720px"><div style="display:grid;gap:16px;grid-template-columns:1fr 1fr">
  ${f("ia","Adresse",c.address,"12 rue …",true)}${f("ic","Code postal et ville",c.city,"75000 Paris")}${f("ip","Téléphone",c.phone,"06 …")}
  ${f("ii","Instagram",c.instagram,"@leking.barber")}${f("ib","Prénom du barbier",c.barber,"Vide = bloc masqué")}
  <label style="grid-column:1/-1"><span class="alabel">Présentation du barbier</span><textarea class="ainput" id="io" rows="3">${esc(c.bio)}</textarea></label></div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:20px"><button class="abtn" id="isave">Enregistrer</button><a class="abtn o" href="#/">Voir le site</a></div></section>`)}
function bindInfo(){$("#isave").onclick=()=>{S.salon={address:$("#ia").value.trim(),city:$("#ic").value.trim(),phone:$("#ip").value.trim(),instagram:$("#ii").value.trim(),barber:$("#ib").value.trim(),bio:$("#io").value.trim()};save();toast("Infos enregistrées, visibles sur le site")}}

/* ---------- Routeur ---------- */
function render(scrollTop){
  const h=route;const p=h.split("/").filter(Boolean);
  const app=$("#app");let after=()=>{};
  window.onscroll=null;document.body.style.overflow="";
  if(p[0]==="admin"){demoBar("admin");
    if(p[1]==="agenda"){app.innerHTML=agenda(p[2],p[3])}
    else if(p[1]==="rdv"){app.innerHTML=rdvDetail(p[2]);after=()=>bindDetail(p[2])}
    else if(p[1]==="nouveau"){app.innerHTML=newBooking(p[2]);after=bindNew}
    else if(p[1]==="horaires"){app.innerHTML=hoursPage();after=bindHours}
    else if(p[1]==="prestations"){app.innerHTML=servicesPage();after=bindServices}
    else if(p[1]==="infos"){app.innerHTML=infoPage();after=bindInfo}
    else app.innerHTML=dashboard();
  } else {demoBar("site");
    if(p[0]==="reserver"){app.innerHTML=reserve(p[1]);after=()=>{bindHeader();bindReserve()}}
    else if(p[0]==="rdv"){app.innerHTML=confirmation(p[1],p[2]==="nouveau");after=()=>{bindHeader();bindConfirmation(p[1])}}
    else {app.innerHTML=home();after=()=>{bindHeader();observe()}}
  }
  after();if(scrollTop)scrollTo({top:0});
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#/"]');if(!a||e.defaultPrevented)return;e.preventDefault();go(a.getAttribute("href").slice(1))});
$("#reset").onclick=e=>{e.preventDefault();e.stopPropagation();ask("Remettre la démo à zéro ?",()=>{S=seed();save();Object.assign(B,{step:"service",service:null,date:null,slot:null,notice:null,win:null});route="/";render(true);toast("Démo réinitialisée")})};
render();
</script>
